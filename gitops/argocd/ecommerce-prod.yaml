apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ahmeddiaa128/ecommerce-microservices.git
    targetRevision: feature/devops-setup
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
