name: Ecommerce CI/CD Pipeline

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
    paths:
      - "services/**"
      - "k8s/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:

  docker-build:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ApiGateway
          - UserService
          - ProductService
          - CartService
          - OrderService

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # Detect environment
      # -------------------------

      - name: Detect environment and Docker target
        run: |

          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            ENV=prod
            TARGET=prod
          else
            ENV=dev
            TARGET=dev
          fi

          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV

          echo "Environment: $ENV"
          echo "Docker target: $TARGET"

      # -------------------------
      # Set variables
      # -------------------------

      - name: Set service variables
        run: |

          SERVICE="${{ matrix.service }}"
          SERVICE_LOWER=$(echo "$SERVICE" | tr '[:upper:]' '[:lower:]')

          IMAGE="abodiaa/$SERVICE_LOWER:${{ github.sha }}"

          echo "SERVICE=$SERVICE" >> $GITHUB_ENV
          echo "SERVICE_LOWER=$SERVICE_LOWER" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # -------------------------
      # Build image
      # -------------------------

      - name: Build Docker image
        run: |

          echo "Building $IMAGE"

          if [ "$SERVICE" = "ApiGateway" ]; then

            echo "API Gateway has no target"

            docker build \
              -f services/$SERVICE/Dockerfile \
              -t $IMAGE \
              .

          else

            docker build \
              --no-cache \
              --target $TARGET \
              -f services/$SERVICE/Dockerfile \
              -t $IMAGE \
              .

          fi

      # -------------------------
      # Push image
      # -------------------------

      - name: Push Docker image
        run: docker push $IMAGE

      # -------------------------
      # Security scan
      # -------------------------

      - name: Scan image with Trivy
        run: |

          docker run --rm \
            aquasec/trivy:0.69.3 image \
            --severity CRITICAL \
            --exit-code 1 \
            $IMAGE

  # =========================================================
  # Update Kustomize (GitOps)
  # =========================================================

  update-kustomize:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |

          curl -s \
          https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
          | bash

          sudo mv kustomize /usr/local/bin/

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # -------------------------
      # Detect environment again
      # -------------------------

      - name: Detect environment
        run: |

          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            ENV=prod
          else
            ENV=dev
          fi

          echo "ENV=$ENV" >> $GITHUB_ENV

      # -------------------------
      # Update image tags
      # -------------------------

      - name: Update image tags
        run: |

          TAG=${{ github.sha }}

          echo "Updating $ENV images to $TAG"

          cd k8s/overlays/$ENV

          kustomize edit set image \
            abodiaa/apigateway=abodiaa/apigateway:$TAG

          kustomize edit set image \
            abodiaa/userservice=abodiaa/userservice:$TAG

          kustomize edit set image \
            abodiaa/productservice=abodiaa/productservice:$TAG

          kustomize edit set image \
            abodiaa/cartservice=abodiaa/cartservice:$TAG

          kustomize edit set image \
            abodiaa/orderservice=abodiaa/orderservice:$TAG

      # -------------------------
      # Commit
      # -------------------------

      - name: Commit changes
        run: |

          git add k8s/overlays/

          git commit -m "chore: update image tag to ${{ github.sha }}" \
          || echo "No changes to commit"

      - name: Push changes
        run: git push
