apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config

  labels:
    app: cartservice
    component: backend
data:
  GRPC_PORT: "50057"
  APP_ENV: "dev"

  # Redis
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis-cart"
  REDIS_PORT: "6379"


  # Downstream gRPC services
  USER_SERVICE_GRPC_ADDR: "userservice.ecommerce-dev.svc.cluster.local:50051"
  PRODUCT_SERVICE_GRPC_ADDR: "productservice.ecommerce-dev.svc.cluster.local:50053"

